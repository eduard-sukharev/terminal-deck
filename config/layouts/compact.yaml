# Compact clamshell layout recipe.
#
# Laptop arrangement, front (+Y, toward the user) to rear (-Y, the hinge):
#
#   palm rest  |  keyboard  |  rear I/O strip (SBC + USB hub)
#
# The keyboard's switch plate stands on 10 mm standoffs, and the battery
# lives in that hollow. The SBC does not: its power inlet and microSD are
# the two things that must be reachable without opening the case, so it sits
# in the rear strip against the wall instead. The hub sits beside it, in the
# rear-right corner, flipped so its two port-bearing edges face the rear and
# right walls.
#
# Every value is derived from component sizes and config, so re-measuring a
# part (the battery and hub are still TODO: measure) moves the layout with it.

constraints:
  # ── Enclosure envelope ────────────────────────────────────────────────
  # Declared first: the wall-relative constraints below align against this
  # rather than guessing from whatever is placed so far.
  #   width = widest of keyboard/display + clearance + walls
  #   depth = rear strip (SBC) + gap + keyboard + walls (no palm rest —
  #           the group is centered on Y below so the symmetric enclosure
  #           hugs the content instead of wasting a front palm rest)
  - kind: target_envelope
    width: "{display.width} + 2 * {config.clearance.shell} + 2 * {config.wall_thickness}"
    depth: "{sbc.depth} + 2.0 + {keyboard.depth} + 2 * {config.clearance.shell} + 2 * {config.wall_thickness}"
    description: >-
      Display-limited in X; in Y the rear I/O strip plus the 40% keyboard,
      centered so the symmetric enclosure is as small as the content allows.

  # ── Rear I/O strip ────────────────────────────────────────────────────
  # SBC hard against the rear wall so its -Y power inlet reaches it, and
  # against the left wall so the -X microSD slot reaches that one.
  - kind: edge_alignment
    subject: sbc
    subject_edge: rear
    target: enclosure
    target_edge: rear
  - kind: edge_alignment
    subject: sbc
    subject_edge: left
    target: enclosure
    target_edge: left

  # Hub mounted upside down (flip) rather than turned 180° about Z: its
  # north edge (3x USB-A + micro-SD + audio + USB-C) and east edge (1x
  # USB-A) are rigidly 90° apart on the physical board, so a Z-rotation
  # alone can only pair "rear + left" or "front + right" — never the
  # "rear + right" corner this recipe aligns it into below. Flipped, its
  # top face sits at z=hub.height and the body hangs down to the floor
  # (z=0), same as an unflipped board sitting on the floor.
  - kind: fixed_position
    subject: usb_breakout
    rotation: 0.0
    flip: true
    z: "{usb_breakout.height}"
  - kind: edge_alignment
    subject: usb_breakout
    subject_edge: rear
    target: enclosure
    target_edge: rear
  - kind: edge_alignment
    subject: usb_breakout
    subject_edge: right
    target: enclosure
    target_edge: right

  # ── Keyboard ──────────────────────────────────────────────────────────
  # Centered on X; on Y it clears the rear strip by 2 mm, which leaves the
  # palm rest as the remainder of the envelope.
  - kind: centered_on
    subject: keyboard
    axes: ["x"]
  - kind: edge_alignment
    subject: keyboard
    subject_edge: rear
    target: sbc
    target_edge: front
    offset: 2.0

  # ── Battery, in the hollow under the switch plate ─────────────────────
  # Left of the RP2040 controller, which occupies the middle of that space.
  - kind: relative_placement
    subject: battery
    target: keyboard
    offset_x: -50.0

  # ── Compactness: center the base content on Y ─────────────────────────
  # The enclosure is symmetric about the origin, so its depth is set by the
  # larger of the rear (SBC) and front (keyboard) extents. Centering the
  # whole base group makes those two extents equal, shrinking the depth to
  # the minimum the content allows instead of wasting a front palm rest.
  - kind: centered_group
    subjects: ["sbc", "keyboard", "battery", "usb_breakout"]
    axes: ["y"]

  # ── Base floor ────────────────────────────────────────────────────────
  # usb_breakout is flipped and gets its z set explicitly above, since this
  # resolver would otherwise overwrite it with a flip-unaware z=0.
  - kind: z_stack
    layers: [["keyboard", "sbc", "battery"]]

  # ── Lid ───────────────────────────────────────────────────────────────
  # The lid closes onto the base rim, so the display sits one keyboard-height
  # up, plus the lid's bottom wall and the driver board behind the panel:
  #   keyboard + clearance + wall + clearance + driver
  - kind: fixed_position
    subject: display
    z: "{keyboard.height} + 2 * {config.clearance.shell} + {config.wall_thickness} + {driver.height}"
  - kind: centered_on
    subject: display
    axes: ["x", "y"]

  # Driver board flat against the panel back (flipped), rotated 180° so its
  # FPC slot faces the panel ribbon. Offsets come from the component's own
  # reference_origin() (config/display.yaml driver_board), so the recipe
  # cannot drift away from the component definition. offset_z is -0.5 to
  # keep the PCB backside 0.5 mm off the panel (a flipped board hangs below
  # its origin).
  - kind: relative_placement
    subject: driver
    target: display
    use_reference_origin: true
    offset_z: -0.5
    rotation: 180.0
    flip: true

  # ── Checks ────────────────────────────────────────────────────────────
  # These produce no placements; they fail the build when the arrangement
  # above stops being physically buildable.

  # The three ports that must survive to the shell as real openings.
  - kind: port_access
    subject: sbc
    connector_type: Power
    wall: rear
  - kind: port_access
    subject: sbc
    connector_type: MicroSD
    wall: left
  - kind: port_access
    subject: usb_breakout
    connector_type: USB-A
    wall: rear

  # The battery has to fit the hollow under the plate without fouling the
  # plate above it or the controller beside it.
  - kind: clearance
    subject: battery
    target: keyboard
    gap: 1.0

  # Rear strip parts must not run into each other.
  - kind: clearance
    subject: sbc
    target: usb_breakout
    gap: 2.0
    axis: x

  # Nothing in the base may touch the lid when it closes.
  - kind: clearance
    subject: keyboard
    target: driver
    gap: 2.0
    axis: z

  # HDMI from the SBC to the driver board, through the hinge wire tunnel.
  - kind: cable_path
    from_component: sbc
    from_connector_type: HDMI
    to_component: driver
    to_connector_type: HDMI
    via_point:
      - 0.0
      - "0 - ({sbc.depth} + 2.0 + {keyboard.depth} + 2 * {config.clearance.shell} + 2 * {config.wall_thickness}) / 2 - {config.wall_thickness}"
      - "{keyboard.height} + {config.clearance.shell}"
    clearance_diameter: "{config.hinge.wire_tunnel}"
    bend_radius: 30.0
