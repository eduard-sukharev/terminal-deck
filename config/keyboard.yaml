# Keyboard configuration: 40% Cherry-MX compatible, RP2040, QMK/Vial.
# All dimensions in millimeters.

keyboard:
  layout_source: keyboard/layouts/jd40.json
  switch:
    family: mx_alps
  stabilizer:
    family: cherry
  plate:
    thickness: 1.5
    wobble: 0.6          # keycap wobble allowance each side of the Well Cutout
                         # (ADR-0014; assumed from switch play -- confirm on the
                         # assembled plate). Not the plate's old border: the
                         # plate is Cutout + one wall each side.
    edge_margin: 2.5
    corner_radius: 2.0
  mounting:
    screw: M2
    edge_offset: 5.0
  keycap:
    profile: xda
    enabled: true
  controller:
    rp2040: true
    width: 18.0
    depth: 23.5
    height: 5.3
    x: 0.0            # controller center X offset under the plate (mm)
    y: 0.0            # controller center Y offset under the plate (mm)
    z_clearance: 2.0  # gap between controller top and plate underside (mm)

