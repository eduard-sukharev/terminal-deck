# Default clamshell layout recipe.
#
# Same clamshell arrangement as compact.yaml, front (+Y) to rear (-Y):
#
#   palm rest  |  keyboard  |  rear I/O strip (SBC + battery + USB hub)
#
# The difference is the battery: here it sits on the base floor beside the
# SBC rather than in the hollow under the keyboard's raised switch plate.
# That costs about 10 mm of depth and buys a deck whose every part can be
# reached by removing the bottom cover alone, without unbolting the
# keyboard. Use compact.yaml when depth matters more than that.
#
# Every value is derived from component sizes and config, so re-measuring a
# part (the battery and hub are still TODO: measure) moves the layout with it.

constraints:
  # ── Enclosure envelope ────────────────────────────────────────────────
  # Declared first so the wall-relative constraints below have real walls to
  # align against instead of estimating from what is placed so far.
  #   width = the rear strip (SBC | battery | hub, side by side with a 2 mm
  #           gap each) + clearance + walls — the hub's 133 mm width makes
  #           this strip wider than the display, unlike the depth axis below
  #   depth = rear strip (battery, the deepest) + gap + keyboard
  #           + 30 mm palm rest + walls
  - kind: target_envelope
    width: "{sbc.width} + 2.0 + {battery.width} + 2.0 + {usb_breakout.width} + 2 * {config.clearance.shell} + 2 * {config.wall_thickness}"
    depth: "{battery.depth} + 2.0 + {keyboard.depth} + 30.0 + 2 * {config.wall_thickness}"
    description: >-
      Rear-strip-limited in X (SBC + battery + hub side by side); in Y a
      single-floor rear I/O strip plus a 30 mm palm rest around the 40%
      keyboard.

  # ── Rear I/O strip: SBC | battery | hub, all against the rear wall ────
  # SBC also against the left wall, so its -X microSD slot reaches it.
  - kind: edge_alignment
    subject: sbc
    subject_edge: rear
    target: enclosure
    target_edge: rear
  - kind: edge_alignment
    subject: sbc
    subject_edge: left
    target: enclosure
    target_edge: left

  # Battery beside the SBC (not centered — the hub's real width leaves no
  # room for a centered battery to clear it).
  - kind: relative_placement
    subject: battery
    target: sbc
    offset_x: "{sbc.width} / 2 + 2.0 + {battery.width} / 2"
  - kind: edge_alignment
    subject: battery
    subject_edge: rear
    target: enclosure
    target_edge: rear

  # Hub mounted upside down (flip) rather than turned 180° about Z: its
  # north edge (3x USB-A + micro-SD + audio + USB-C) and east edge (1x
  # USB-A) are rigidly 90° apart on the physical board, so a Z-rotation
  # alone can only pair "rear + left" or "front + right" — never the
  # "rear + right" corner this recipe aligns it into below. Flipped, its
  # top face sits at z=hub.height and the body hangs down to the floor
  # (z=0), same as an unflipped board sitting on the floor.
  - kind: fixed_position
    subject: usb_breakout
    rotation: 0.0
    flip: true
    z: "{usb_breakout.height}"
  - kind: edge_alignment
    subject: usb_breakout
    subject_edge: right
    target: enclosure
    target_edge: right
  - kind: edge_alignment
    subject: usb_breakout
    subject_edge: rear
    target: enclosure
    target_edge: rear

  # ── Keyboard ──────────────────────────────────────────────────────────
  # Centered on X; on Y it clears the battery, the deepest part of the rear
  # strip, by 2 mm. The palm rest is whatever depth remains in front.
  - kind: centered_on
    subject: keyboard
    axes: ["x"]
  - kind: edge_alignment
    subject: keyboard
    subject_edge: rear
    target: battery
    target_edge: front
    offset: 2.0

  # ── Base floor ────────────────────────────────────────────────────────
  # usb_breakout is flipped and gets its z set explicitly above, since this
  # resolver would otherwise overwrite it with a flip-unaware z=0.
  - kind: z_stack
    layers: [["keyboard", "sbc", "battery"]]

  # ── Lid ───────────────────────────────────────────────────────────────
  # The lid closes onto the base rim, so the display sits one keyboard-height
  # up, plus the lid's bottom wall and the driver board behind the panel.
  - kind: fixed_position
    subject: display
    z: "{keyboard.height} + 2 * {config.clearance.shell} + {config.wall_thickness} + {driver.height}"
  - kind: centered_on
    subject: display
    axes: ["x", "y"]

  # Driver board flat against the panel back (flipped), rotated 180° so its
  # FPC slot faces the panel ribbon. Offsets come from the component's own
  # reference_origin() (config/display.yaml driver_board); offset_z is -0.5
  # because a flipped board hangs below its origin, so the driver's top face
  # sits 0.5 mm below the display's Z to keep the PCB backside off the panel.
  - kind: relative_placement
    subject: driver
    target: display
    use_reference_origin: true
    offset_z: -0.5
    rotation: 180.0
    flip: true

  # ── Checks ────────────────────────────────────────────────────────────
  # No placements; these fail the build when the layout above stops being
  # physically buildable.

  - kind: port_access
    subject: sbc
    connector_type: Power
    wall: rear
  - kind: port_access
    subject: sbc
    connector_type: MicroSD
    wall: left
  - kind: port_access
    subject: usb_breakout
    connector_type: USB-A
    wall: rear

  # Rear strip parts must not run into each other.
  - kind: clearance
    subject: sbc
    target: battery
    gap: 2.0
    axis: x
  - kind: clearance
    subject: battery
    target: usb_breakout
    gap: 2.0
    axis: x

  # The keyboard must clear the rear strip, and nothing in the base may
  # touch the lid when it closes.
  - kind: clearance
    subject: keyboard
    target: battery
    gap: 1.0
    axis: y
  - kind: clearance
    subject: keyboard
    target: driver
    gap: 2.0
    axis: z

  # HDMI from the SBC to the driver board, through the hinge wire tunnel.
  - kind: cable_path
    from_component: sbc
    from_connector_type: HDMI
    to_component: driver
    to_connector_type: HDMI
    via_point:
      - 0.0
      - "0 - ({battery.depth} + 2.0 + {keyboard.depth} + 30.0) / 2 - {config.wall_thickness}"
      - "{keyboard.height} + {config.clearance.shell}"
    clearance_diameter: "{config.hinge.wire_tunnel}"
    bend_radius: 30.0
