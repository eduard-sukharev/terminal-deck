# Slider layout (ADR-0009). Declared as constraints; the recipe itself places
# the set in the chassis-centred frame (the keyboard is at the chassis front
# plus the Well margin), so no post-pass shift is needed.
#
# The keyboard is the datum. The chassis front is `well_front_margin` before
# its front edge; the rear band holds the SBC between the two Bearing clamps;
# the display + driver sit in the lid above the rear band. The USB hub is an
# external module on an accessory rail, not a chassis placement.
# The face is flat — no constraint tilts the keyboard.
#
# Wall vocabulary: the resolver's "front" is +Y and "rear" is -Y. The screen
# end of the slider is +Y.

constraints:
  # ── Enclosure hint. Width = the slide budget (the wider of the display and
  #    keyboard plus the drafted side walls); depth
  #    = the slide budget's closed face (the lid's guide span), so the chassis
  #    rear wall is flush with the closed lid instead of the lid overhanging
  #    it. The hint only pins the wall-relative resolvers.
  - kind: target_envelope
    width: "{budget.width}"
    depth: "{budget.chassis_height}"

  # ── Keyboard: the datum, chassis-centred on Y. Rotated 180° so the
  #    spacebar (local +Y "forward") faces the user at -Y, not the screen.
  - kind: fixed_position
    subject: keyboard
    x: 0.0
    y: "-{budget.chassis_height} / 2 + {config.slide.well_front_margin} + {keyboard.depth} / 2"
    z: 0.0
    rotation: 180.0

  # ── RP2040 controller: under the keyboard plate, in the chassis thickness.
  - kind: relative_placement
    subject: controller
    target: keyboard
    offset_x: "({keyboard.width} / 4)"
    offset_y: 0.0
    rotation: 0.0
  - kind: fixed_position
    subject: controller
    z: "{config.wall_thickness}"

  # ── SBC: in the rear band, centred between the Bearing clamps and anchored
  #    to the rear wall (not to the clamp band), so it stays inside the rear
  #    wall when the chassis grows to meet the lid. ────────────────────────
  - kind: relative_placement
    subject: sbc
    target: keyboard
    offset_x: 0.0
    offset_y: "-({keyboard.depth} / 2 + {budget.rear_band} - {config.slide.rear_wall_margin} - {sbc.depth} / 2)"
    rotation: 0.0
  - kind: fixed_position
    subject: sbc
    z: "{config.wall_thickness}"

  # ── Display: centred in the lid on both axes (the lid is centred on the
  #    envelope origin, so x = y = 0 is its middle), matching the reference's
  #    symmetric bezel and keeping both Y ends of the lid's joint band free;
  #    offset_z clears the keycaps (the lid's flat back), that back wall, and
  #    the moving Bearing-clamp head under the panel plus its FPC guard (the
  #    budget derives that cavity, so it follows the head and the guard).
  - kind: relative_placement
    subject: display
    target: keyboard
    from_top: true
    offset_z: "{config.slide.lid_clearance} + {config.slide.lid_back} + {budget.display_cavity}"
  - kind: centered_on
    subject: display
    axes: ["x", "y"]

  # ── Driver board flat against the panel back (flipped), rotated 180° so
  #    its FPC slot faces the panel ribbon; the offset comes from the
  #    component's own reference_origin(). ────────────────────────────────
  - kind: relative_placement
    subject: driver
    target: display
    use_reference_origin: true
    offset_z: "-{config.slide.driver_gap}"
    rotation: 180.0
    flip: true

  # ── Checks. ────────────────────────────────────────────────────────────
  - kind: clearance
    subject: controller
    target: keyboard
    gap: "{config.slide.component_gap}"
  - kind: clearance
    subject: sbc
    target: keyboard
    gap: "{config.slide.component_gap}"
  - kind: clearance
    subject: display
    target: keyboard
    gap: "{config.slide.lid_clearance}"
    axis: z
