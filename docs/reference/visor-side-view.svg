<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" font-family="sans-serif" font-size="13">
<rect width="1400" height="460" fill="#fff"/>
<defs>
 <g id="base"><polygon points="0,0 354,0 354,-75 0,-111" fill="#9aa5ad" stroke="#333"/>
  <text x="177" y="-30" text-anchor="middle">Base (6° deck)</text></g>
 <!-- lid in closed position: flat panel + tapered visor skirt (side wall shown) -->
 <g id="lidA">
  <polygon points="0,-111 354,-75 354,-111" fill="#e8b04a" fill-opacity=".75" stroke="#333"/>
  <rect x="0" y="-135" width="354" height="24" fill="#cfd6db" stroke="#333"/>
  <line x1="30" y1="-114" x2="324" y2="-114" stroke="#1d3d5c" stroke-width="4"/>
 </g>
</defs>
<g transform="translate(60,380)">
 <text x="0" y="-250" font-weight="bold">(a) Visor fills the wedge: closed = box</text>
 <use href="#base"/><use href="#lidA"/>
 <text x="150" y="-119">Lid panel (flat, thin)</text>
 <text x="358" y="-88">Visor wall</text><text x="358" y="-74">(tall at front,</text><text x="358" y="-60">zero at hinge)</text>
 <circle cx="0" cy="-111" r="6" fill="#555"/><text x="-8" y="-118" text-anchor="end">hinge</text>
 <text x="0" y="22">rear</text><text x="354" y="22" text-anchor="end">front (user)</text>
 <text x="40" y="-100" font-size="11" fill="#1d3d5c">screen faces down</text>
</g>
<g transform="translate(560,380)">
 <text x="0" y="-250" font-weight="bold">(b) No Visor: Lid follows the slope</text>
 <use href="#base"/>
 <polygon points="0,-111 354,-75 354,-99 0,-135" fill="#cfd6db" stroke="#333"/>
 <text x="150" y="-105">Lid</text>
 <circle cx="0" cy="-111" r="6" fill="#555"/>
 <text x="0" y="22">rear</text><text x="354" y="22" text-anchor="end">front</text>
 <text x="177" y="50" text-anchor="middle" fill="#a33">angled top, wedge silhouette</text>
</g>
<g transform="translate(1000,380)">
 <text x="0" y="-250" font-weight="bold">(a) opened ~105°</text>
 <use href="#base"/>
 <g transform="rotate(-105 0 -111) scale(0.62) translate(0,-68)"><use href="#lidA"/></g>
 <circle cx="0" cy="-111" r="6" fill="#555"/>
 <text x="70" y="-225">Visor hoods the</text><text x="70" y="-211">top of the screen</text>
 <text x="0" y="22">rear</text><text x="354" y="22" text-anchor="end">front</text>
 <text x="177" y="50" text-anchor="middle" font-size="11" fill="#777">(lid drawn at 62% scale to fit)</text>
</g>
</svg>
