# Hardware configuration: SBC, power, IO, heat inserts, battery.
# All dimensions in millimeters.

sbc:
  name: Orange Pi Zero 2W
  width: 65                # PCB 65 x 30 x 1.4 mm (measured)
  depth: 30
  height: 6.7              # measured total stack: 3.3 top + 1.4 PCB + 2.0 bottom SMD
                           # with optional 7 mm radiators on SoC/memory: 12.1 total
  pcb_thickness: 1.4       # measured
  mounting_holes: 4
  mounting_hole_diameter: 3.0   # official manual: all four positioning holes 3.0 mm
  mounting_hole_inset: 3.5      # hole centers 3.5 mm from board edges (RPi Zero footprint)

power:
  input: usb_c
  voltage: 5

storage:
  microsd: true

io:
  hdmi: true              # 1x Mini HDMI TX 2.0
  usb_a: 0                # no USB-A on the SBC; USB-A comes from the expansion board
  usb_c: 2                # 2x Type-C USB 2.0 (one is power input)

usb_breakout:
  # ZMT23_HUB_VER1.0 multifunction USB hub board (measured with calipers).
  # Ribbon cable on the west edge; 1x USB-A on the east edge; on the north
  # edge, west to east: 3x USB-A, micro-SD reader, audio jack, USB-C.
  pcb_width: 133.0          # measured
  pcb_depth: 24.0           # measured
  pcb_thickness: 1.0        # measured
  port_protrusion: 1.4      # measured: every port overhangs its PCB edge by this much
  # North-edge port spacing (measured): distance from the west PCB edge to
  # the first USB-A, then edge-to-edge gaps between each successive port
  # pair, west to east (USB-A/USB-A/USB-A/micro-SD/audio/USB-C).
  north_first_port_margin: 19.3   # measured
  north_port_gaps: [6.0, 6.0, 9.2, 9.5, 4.5]   # measured
  usb_a:
    width: 13.3              # measured
    height: 8.5               # measured
    depth: 6.0                 # measured
  usb_c:
    width: 9.0                # measured
    height: 7.0                 # measured
    depth: 3.3                   # measured
  audio_jack:
    diameter: 5.0              # measured
    depth: 15.0                  # measured (barrel length)
  microsd:
    width: 13.5                # measured
    depth: 12.0                  # measured
    thickness: 2.0                # measured (height above the PCB top surface)

heat_inserts:
  diameter: 4              # M2.5 heat-set insert outside diameter
  depth: 4
  clearance: 0.2

battery:
  present: true            # sealed deck: internal power source (USB hub is the
                           # only external connectivity)
  width: 60                # TODO: measure chosen cell (60 x 35 x 8 assumed)
  depth: 35
  height: 8
  clearance: 2.0           # keepout margin around the cell in the compartment
