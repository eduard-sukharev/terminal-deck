# Keyboard configuration: 40% Cherry-MX compatible, RP2040, QMK/Vial.
# All dimensions in millimeters.

keyboard:
  layout_source: keyboard/layouts/jd40.json
  switch:
    family: mx_alps
  stabilizer:
    family: cherry
  plate:
    thickness: 1.5
    edge_margin: 2.5
    corner_radius: 2.0
  mounting:
    screw: M2
    edge_offset: 5.0
  keycap:
    profile: xda
    enabled: true
  controller:
    rp2040: true
    width: 23.5
    depth: 18.0
    height: 8.0
    hole_diameter: 2.0
    x: 0.0            # controller center X offset under the plate (mm)
    y: 0.0            # controller center Y offset under the plate (mm)
    z_clearance: 2.0  # gap between controller top and plate underside (mm)

case_bottom_margin: 10
