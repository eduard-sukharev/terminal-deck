# Slide subsystem: purchased linear guide, travel and the face-height budget.
# All dimensions in millimeters. The device is a slider (ADR-0009): the screen
# lid's back panel carries two steel guide rods, each held at both ends by two
# printed Rod clamps; between the clamps a through-slot in the back panel lets
# the Bearing clamps — printed clamps that straddle the panel and are seated in
# the chassis deck — slide as the lid moves. The rods sit *under* the display
# (ADR-0013), so the width is the content plus the lid's thin drafted wall and the lid
# thickness carries the moving head and a printed FPC guard. The face height is
# the binding constraint, so every value here is checked against
# `face_height_limit` by the data layer.

slide:
  face_height_limit: 140.0   # HARD closed face height (the product target)
  travel_clearance: 5.0      # gap between the lid's open edge and the keyboard's upper edge
                             # (`well_front_margin` is derived, not configured: ADR-0014
                             # makes it the face-height budget's remainder after the
                             # Well plate, floored by the front lip that hosts the
                             # plate's M2 boss -- see components/slide.py)
  clamp_wall: 2.0            # wall around the linear bearing in its clamp
  top_bezel: 2.5             # lid face above the display module
  lid_clearance: 1.0         # gap between the keycaps and the lid's flat back
  lid_back: 4.0              # flat back panel wall (carries the rod clamps)
  lid_front: 2.0             # inverted-tray front wall (bezel)
  driver_gap: 0.4            # PCB backside stand-off from the panel
  component_gap: 1.5         # minimum air gap between a buried part and the keyboard,
                             # and between the display and the side guide hardware
  rear_wall_margin: 8.0      # SBC -> chassis rear wall inner face. 8.0 (not 6.0)
                             # keeps the SBC clear of the ADR-0015 centreline
                             # band column at (0, +65.5).
                             # rod_raise is derived: rod diameter/2 - lid_back/2, so
                             # the rod's lowest point always sits at the panel's
                             # mid-thickness (see components/slide.py).
  slot_clearance: 0.25       # each side between the bearing-clamp neck and the slot

  joint:                     # Bezel <-> Back band joint (ADR-0011)
    band: 6.0                # prismatic fastening band at the Bezel's bottom
    boss: 8.0                # square pad per station, standing into the cavity
    boss_margin: 1.5         # material between an insert hole and a free face
    corner_clearance: 0.5    # corner post <-> Rod clamp
    corner_length: 20.0      # corner post along the side wall
    station_inset: 5.0       # station centre from the lid's outer edge
    screw: M3                # driven from the Back's outer face
    head: button             # ordinary button head (ISO 7380) in a keyhole recess

  bearing:                   # LM...LUU linear bushing (one per rod)
    model: LM6UU
    bore: 6.0
    outer_diameter: 12.0
    length: 19.0             # short body: leaves room for the rod end clamps
    per_rod: 1               # a second bearing per rod breaks the 140 mm budget

  rod:
    diameter: 6.0
    stock_length: 130.0      # purchased WCS6 rod length (ADR-0031): the usable
                             # span is this length, never a cut of our own
    end_support: 3.75        # lid material beyond the rod's usable span;
                             # with a stock length this is the face budget's
                             # remainder ((140 - 2.5 - 130) / 2)
    side_margin: 2.5         # keep the stance a margin inside its tightest
                             # bound (the Deck seat vs the chassis band corner
                             # boss is a plan-space proxy for a Z-separated pair)

  fpc_guard:                 # printed grille plate between the ribbon and the
                             # moving Bearing-clamp head: tape-bonded to the
                             # display's back, channel open at both ends
    total: 1.6               # grille floor (total - recess) + ribbon channel
    recess: 0.6              # channel depth on the display-facing side; must
                             # swallow display.flex.stack
    margin: 5.0              # plan margin beyond the ribbon and the slot band
    sag_allowance: 0.5       # TODO: measure by a load test on the assembled lid
                             # (0.5 assumed): the head is a printed cantilever
                             # bolted into the Deck, the display is lip-retained
    grille_slot: 2.0         # max width of a blind lightening slot
    fit: 0.4                 # clearance to the driver's FPC connector body

  rod_clamp:                 # printed end clamps: 2 per rod, on the lid back panel
    length: 8.25             # grip length along the rod at each end: with the
                             # 130 mm stock rod the two clamps plus their
                             # clearances are the rod's remainder over the
                             # bearing's travel (ADR-0031)
    height: 7.5              # block height above the back panel's inner face: a saddle
                             # over the rod's top half, still inside the bezel cavity
    width: 22.0              # across the rod; the screws sit outside the slot
    clearance: 0.5           # axial gap between the bearing's extreme and the clamp
    screw: M2
    screw_span: 16.0         # centre distance of the two screws across the rod (reduced by 1mm)
    set_screw: M2            # locks the rod axially in the clamp
    # Edge treatment (chamfers) for the printed rod clamp:
    bottom_edge_chamfer: 1.0   # 1mm chamfer on the two sharp bottom edges from the bore cut
    general_chamfer: 0.5       # 0.5mm chamfer on all other convex edges (incl. bore circular edges)
    top_edge_chamfer: 1.0      # 1mm chamfer on front/back top edges (along Y at Z=height)
    # Screw holes (mounting + set screw) get no chamfer

  bearing_clamp:             # printed clamp: holds the bearing, straddles the panel
    # ADR-0033: the clamp is split on the bearing's axis into a lower half
    # (foot + bore's belly, prints foot-down) and an upper half (crown + bore's
    # roof, prints crown-down).  Each half's layers run parallel to the split
    # face, so the bore is never a bridge.  One M3 screw per side does both
    # jobs: driven up from inside the chassis it passes the Deck's seat floor
    # and the lower half's foot and belly, and threads into a heat-set insert in
    # the upper half.  The head stays in the chassis cavity, so no recess is
    # cut and the seat floor is not weakened.
    length: 19.0             # body AND foot length = slide.bearing.length; the
                             # screen's edge loads reach the bearing as a lever,
                             # so the clamp spreads them over the whole bearing
    foot_thickness: 4.0      # the lower half's foot, seated in the Deck pocket
    crown_wall: 2.0          # upper-half material above the bearing's outer face
                             # (the budget's own crown wall: 9.00, guard at 11.00)
    seat_wall: 2.6           # material around the chassis seat pocket (it is
                             # also what a pan head has to stay inside)
    seat_floor: 2.0          # the Deck's material under the pocket floor: the
                             # foot rests on it and the screw head compresses it
    seat_fit: 0.4            # clearance each side of the foot in the pocket
    corner_chamfer: 2.0      # 45 deg vertical corner relief on the foot AND the
                             # body, and the matching chassis pocket
    top_chamfer: 0.5         # matching pocket mouth (the clamp's top is flat)
    edge_chamfer: 0.5        # 45 deg break on the split line (the V-groove at
                             # the joint) and on the bore's end rims, so the
                             # bearing enters cleanly and the layer seam is not a
                             # sharp edge
    # The screw pair: M3 pan head, from inside the chassis up into the upper
    # half.  The span is derived from the bore, the split chamfer, the printable
    # minimum and the insert (components.slide.bearing_clamp_screw_span), so it
    # is not configured.  The length is the purchased one and is checked
    # against the stack (seat floor + foot + belly + insert).
    screw: M3
    screw_length: 18.0       # 2 seat floor + 4 foot + 6 belly + 5 insert + 1
    # Heat-set insert.  The long M3 body is pressed in from the crown, flush
    # with it: the hole is Ø4.4 down to the seat, then only the screw's Ø3.2
    # passage, so the insert's skirt lands on that step and the joint's preload
    # is carried in compression into the upper half -- not by the knurling.
    insert: M3-long

  chain:                     # drag chain behind the screen, along the slide
    pitch: 10.0
    width: 12.0
    link_height: 6.0
    bend_radius: 30.0        # HDMI minimum bend radius (routing.cable_routing)

  rail:                      # printed accessory rail on the Tray's X walls
    interface: picatinny     # the profile lands in the next slice; the station
                             # pattern and the rail blank do not change
    stations: 2              # per side, mirrored fore and aft of the centre
    station_spacing: 60.0    # M4 axis to M4 axis; a whole number of pitches,
                             # which also puts both on rail bridge centres
    width: 21.2              # MIL-STD-1913 width across the wall (overhangs)
    height: 5.0              # rail thickness off the wall
    pitch: 10.0              # slot pitch of the profile
    screw: M4                # button head in a counterbore, from outside
    head: button
    nut: M4                  # DIN 562 square nut in the printed washer puck
    fit: 0.2                 # printed puck in its pad pocket

  # Sectioning (ADR 0015): every part is still cut into two Sections, but the
  # Seams are staggered so no two Seams of a screw-joined pair ever coincide.
  # The Deck (the welled top) and the Bezel (the display carrier) take a
  # straight Seam just left of centre; the Tray (the bottom bowl) and the Back
  # plate (the lid's flat panel) take a trapezoid Seam that runs at +10 in the
  # middle and steps out to +18 at the end walls on 45 degree jogs. One
  # long-wall band station per wall sits at x=0, between the two Seams, and its
  # M3 screw cross-ties the lapped pieces. Offsets stay inside 10..20 mm.
  # The keyboard plate takes no Split here: it splits **between keys** along
  # the row-jogging Seam its layout derives (keyboard.geometry.seam.plate_seam,
  # ADR-0014 / issue #9), so a straight cut through a switch cutout cannot be
  # configured back in. The retired `keyboard_plate` key is ignored.
  split:
    chassis_tray:   {sections: 2, x: 10.0, style: trapezoid, ends_x: 18.0, jog: 45.0}
    chassis_deck:   {sections: 2, x: -14.0, style: straight}
    screen_lid_bezel: {sections: 2, x: -14.0, style: straight}
    screen_lid_back:  {sections: 2, x: 10.0, style: trapezoid, ends_x: 18.0, jog: 45.0}

  # Seam pins (ADR 0006, `seam_pin` in default.yaml): two pairs of fins per
  # Seam, each pair with a filament pin glued between them. Values are the
  # pocket centres in the part's own Y. Chosen clear of the interior:
  #   chassis_tray  -49 / +8  -- clear of the RP2040 (x -67..-49, y -34..-10)
  #                    and of the SBC (y 30..60); both under the plate, 12 mm
  #                    below it (the pins stand on the floor at z 2..4)
  #   chassis_deck  +30 / +52 -- both in the rear band, above the SBC (z 8.7);
  #                    the front strip is only 5.65 mm and the pocket is 4.8.
  #                    Stay >= 26.5: the rear-seam M2 boss is a full-height
  #                    column now (17.8 to the ceiling 30.3) and the pocket
  #                    hangs down from that same ceiling.
  #   screen_lid_bezel -50 / +50 -- outboard of the display (y +-32.25) and the
  #                    driver (y <= 27.75), inside the front panel's inner face
  #   screen_lid_back  -49 / +49 -- outboard of the display and driver, clear of
  #                    the rods (|x| 94.98) and the clamp slots
  # The keyboard plate is NOT listed: its sites are derived from the plate
  # Seam's own row-gap boundaries (keyboard.geometry.seam.pin_sites), so any
  # layout gets pins in the right place without a config entry. Add a
  # `keyboard_plate:` list here only to override that derivation.
  seam_pin_sites:
    chassis_tray: [-49.0, 8.0]
    chassis_deck: [30.0, 52.0]
    screen_lid_bezel: [-50.0, 50.0]
    screen_lid_back: [-49.0, 49.0]

  # Vent slots: deferred (ADR-0011). The rear wall's joint band has to stay
  # solid and the old row would pierce it; the pattern is redesigned together
  # with the band. The generic generator stays in geometry/vents.py.
