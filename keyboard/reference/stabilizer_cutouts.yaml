# Stabilizer cutout geometry — transcribed from swill/kb_builder
# (builder.swillkb.com, AGPL-3.0, lib/builder.py:424-572).
#
# Vertex coordinates are symbolic strings resolved at geometry-build time:
#   "7-k"         → 7 - k
#   "x+4.2-k"     → x + 4.2 - k
#   "-x-1.65+k"   → -x - 1.65 + k
# where x = the key's stabilizer offset (from center_offsets) and
# k = per-key kerf/2 (kb_builder's _k/2).
#
# Each type has two polygon templates:
#   key_2u      — for keys 2.0 ≤ width < 3.0 (fixed, no x term)
#   spacebar    — for keys width ≥ 3.0 (parametric in x)
# costar has two polygons per template (left/right); the others have one.

center_offsets:
  "300": 19.05
  "400": 28.575
  "450": 34.671
  "550": 42.8625
  "625": 50
  "650": 52.38
  "700": 57.15
  "800": 66.675
  "900": 66.675
  "1000": 66.675
default_offset: 11.95

