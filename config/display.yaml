# Display configuration: 8.8" ultrawide LCD with HDMI driver board.
# All dimensions in millimeters. Verified against the HannStar HSD088IPW1-A00
# panel (the standard 8.8" 1920x480 module used with HDMI->MIPI driver boards).

display:
  width: 231.0             # module outline width, measured
  height: 64.5             # module outline height, measured
  thickness: 6.5           # module outline depth, measured
  diagonal: 8.8            # inches, informational
  active_width: 218.88     # active area width, informational (datasheet)
  active_height: 54.72     # active area height, informational (datasheet)
  flex:
    width: 38.5            # FPC ribbon width, measured
    thickness: 1.0         # TODO: measure ribbon thickness (1.0 assumed)
    fold: 6.0              # TODO: measure folded-ribbon allowance behind panel
                           # (6.0 assumed)
    edge_protrusion: 0.75  # ribbon stub standing proud of the panel's east
                           # short edge, toward the driver slot (0.5-1.0)

bezel:
  inset: 3                  # glass recess inset from panel edge
  thickness: 2              # bezel wall thickness over the glass edge

glass:
  recess_depth: 1.5         # glass recess depth into lid

driver_board:
  width: 55                 # measured
  depth: 45.5               # measured
  height: 4.6               # PCB 1.3 + tallest socket 3.3, measured
  pcb_thickness: 1.3        # measured
  fpc_slot_height: 1.0      # TODO: measure FPC slot opening height (1.0 assumed)
  offset_x: -9.5           # driver center X from display center — mounts the
                           # driver back-to-back behind the LCD (flipped flat
                           # against the panel back, rotated 180° so its FPC
                           # slot faces east). Derived from the user-measured
                           # 125 mm from the panel's FPC edge toward the panel
                           # center: display half-width (115.5) - 125 = -9.5.
                           # The board stays fully behind the panel outline.
                           # (TODO: confirm against the real ribbon length)
  offset_y: 5.0             # aligns the driver FPC slot center with the panel FPC center

mounts:
  holes: 4
  hole_diameter: 2.2
