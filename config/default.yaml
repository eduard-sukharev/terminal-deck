# Top-level build configuration for the cyberdeck.
# All dimensions in millimeters.

wall:
  thickness: 2.0        # single wall-thickness parameter; everything derives from it

corners:
  chamfer: 4            # 45 deg chamfer on the outer case corners (chamfer-first, no fillets outside)

draft:
  lid: 7.0              # degrees from vertical on the screen lid's X side
                        # walls: the lid widens from its face panel down to the
                        # back panel, so the two halves are widest where they
                        # meet. The Tray's side walls are *vertical* (ADR-0019):
                        # the accessory rail bolts to a flat, square face, and a
                        # drafted wall would put the rail on a slope. The front
                        # and rear end walls are vertical too (the guide span
                        # and rod end clamps are pinned to the 140 mm face
                        # budget); they leave the table with the base taper.

clearance:
  shell: 0.35           # air gap between a component and the shell interior
  insert: 0.2           # heat-set insert hole clearance (diameter oversize)
  screw: 0.6            # minimum radial clearance around a screw head / boss
  head: 0.2             # ordinary head in its recess: radial gap, and how far
                        # its top face stays below the outer face (ADR-0018)

screws:
  body: M2              # case body screws (fastener library)
  standoff: M2.5        # board standoff screws
  deck: M3              # Deck screws, driven from below into heat-set inserts

material:
  name: PLA
  layer_height: 0.2
  minimum_feature: 0.6  # printable minimum wall/feature thickness
  min_bed_face_area: 100.0  # mm^2; every Section needs a flat face at least this big on the bed

# Parting plane (ADR 0003): the horizontal plane where the Deck meets the
# Tray. The chassis is built as those two parts (ADR-0012).
parting:
  front_wall_fraction: 0.5
  min: 10.0
  max: 20.0

# Chassis Tray <-> Deck band joint (ADR-0012). The chassis splits at the
# Parting plane; the band is split evenly around it: the Tray is prismatic from
# its base to the plane (ADR-0019 removed its draft), the Deck is prismatic all
# the way to the closed face. Twelve M3 screws are driven from below through the
# Tray floor into heat-set inserts in the Deck's band: four corners, three per
# long side, one per short side. The outer skin is plain: no relief is cut into
# the band (ADR-0016).
chassis_joint:
  band: 6.0            # band split 3 mm each side of the Parting plane
  boss: 10.0           # insert boss diameter at the plane (capped per station)
  boss_margin: 1.5     # material between an insert hole and a free face
  station_inset: 6.5   # station centre from a vertical (X) wall's outer face
  side_inset: 4.5      # station centre from a vertical (front/rear) wall
  screw: M3            # driven from below into a heat-set insert
  head: button         # ordinary button head (ISO 7380) buried one wall below
                       # the Parting plane in a deep conical access cavity
                       # (ADR-0021; the lid's band joint keeps ADR-0018's
                       # keyhole)
  taper_angle: 15.0    # base taper on the vertical front/rear walls: draft
                       # angle from vertical (ADR-0019); runs from the table up
                       # to the band's bottom, the cavity following so the wall
                       # keeps its thickness; it dies into a pad at every
                       # station so the access cones keep their lip (ADR-0021)
  taper_runout: 3.0    # how far that taper fades into a station pad

# Merged boss (ADR 0003): a boss, column, standoff or lug whose outer surface is
# closer than `threshold_factor * wall` to a wall face is fused into that wall
# (hull to the wall, both walls in a corner). Its bore may then come within
# `bore_margin` mm of the wall's inner face, leaving >= wall + bore_margin to
# the outer skin.
merged_boss:
  threshold_factor: 2.0
  bore_margin: 0.5

# Edge treatment (ADR 0003): chamfer-first — outside faces are always
# chamfered. Concave joints get a stress-relief chamfer of
# `chamfer_factor * wall`; `bed_chamfer` is the 45 deg chamfer on each
# Section's bed-face outer edge (elephant's foot). The only fillets are the
# vertical concave joints, hidden inside the assembly.
edges:
  chamfer_factor: 0.5
  bed_chamfer: 0.5
  seam_convex_extra: 0.5

# Seam pins (ADR 0006): two parallel printed fins straddle a Section Seam and
# leave a `gap`-wide slot between them; a length of `pin` filament is glued in
# while the part is assembled, registering the two Sections until the screws
# that cross the Seam are in. The fins are `fin` thick and `height` tall,
# `length` long across the Seam (half per Section); their outer top edge takes
# a 45 deg `chamfer`, the slot faces stay flat. Where each pin goes is
# `slide.seam_pin_sites` (it depends on the interior).
seam_pin:
  pin: 1.75
  gap: 2.0
  fin: 1.4
  height: 2.0
  length: 10.0
  chamfer: 1.0
