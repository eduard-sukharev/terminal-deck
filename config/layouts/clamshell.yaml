# The cyberdeck layout: a compact clamshell, declared as constraints.
#
# This is the only layout. `--layout compact` resolves it; point
# `--layout-recipe <path>` at a copy of this file to try a variant without
# touching the build.
#
# Laptop arrangement, front (+Y, toward the user) to rear (-Y, the hinge):
#
#   keyboard  |  rear I/O strip (SBC + USB hub)
#
# There is no palm rest: the whole base group is centered on Y so the
# symmetric enclosure hugs its contents. The keyboard's switch plate stands
# on standoffs and the battery lives in that hollow. The SBC does not: its
# only externally-reachable connector is the USB hub's rear port strip
# (the SBC's own Power/HDMI/USB-C are all internal — the hub is the deck's
# one external USB/power surface), so the SBC sits wherever keeps its
# internal USB-C-OTG cable to the hub short, rather than against a wall.
#
# SBC in the rear-right corner, rotated 270° so its I/O edge (HDMI +
# USB-C-OTG + Power — all internal, none need a wall) faces west, toward
# the hub. The microSD slot (west-facing before this rotation) now faces
# the keyboard instead of a wall and loses its external access — accepted
# per the current hardware plan; re-flashing means opening the case.
#
# Hub in the rear-left corner. Its north edge (3x USB-A + micro-SD + audio
# + USB-C) must still face rear, and its lone side port must now face left
# (west) instead of right, to stay on the case's outer edge in the new
# corner. A plain 180° Z-rotation (no flip) achieves both at once — the
# same "north+side, 90° apart" board geometry that used to require a flip
# to reach "rear+right" reaches "rear+left" with rotation alone. Unflipped
# also means the board sits right-side-up, rather than upside-down for no
# reason now that flipping isn't needed for the port pairing.
#
# Every value is derived from component sizes and config, so re-measuring a
# part (the battery and hub are still TODO: measure) moves the layout with
# it. The `fixed_position` entries below are the deliberate manual
# overrides — each one carries the reason it cannot be derived.

constraints:
  # ── Enclosure envelope ────────────────────────────────────────────────
  # Declared first: the wall-relative constraints below align against this
  # rather than guessing from whatever is placed so far.
  #   width = widest of keyboard/display + clearance + walls
  #   depth = rear strip (SBC) + gap + keyboard + walls (no palm rest —
  #           the group is centered on Y below so the symmetric enclosure
  #           hugs the content instead of wasting a front palm rest)
  - kind: target_envelope
    width: "{display.width} + 2 * {config.clearance.shell} + 2 * {config.wall_thickness}"
    depth: "{sbc.depth} + 2.0 + {keyboard.depth} + 2 * {config.clearance.shell} + 2 * {config.wall_thickness}"
    description: >-
      Display-limited in X; in Y the rear I/O strip plus the 40% keyboard,
      centered so the symmetric enclosure is as small as the content allows.

  # ── Rear I/O strip ────────────────────────────────────────────────────
  # SBC hard against the rear wall and the right (east) wall. Rotated 270°
  # about Z so its I/O edge (HDMI + USB-C-OTG + Power, all internal — see
  # header) faces west, toward the hub, instead of its unmodified-recipe
  # rear-facing orientation. `edge_alignment` below is rotation-aware (it
  # reads the rotation already set here and aligns the true rotated
  # footprint), so "right"/"rear" below place the SBC's actual world-space
  # edges, not its unrotated local ones — a 65x30 mm board rotated 90°
  # occupies 30 mm in X and 65 mm in Y.
  #
  # Raised one wall-thickness off the floor, onto its own mounting bosses,
  # so it clears the base floor's stiffening ribs (geometry.ribs.rib_height;
  # OrangePiZero2W.set_floor_raise sizes the bosses to match). Set here
  # rather than left to z_stack below, so that resolver doesn't reset it
  # back to z=0.
  - kind: fixed_position
    subject: sbc
    rotation: 270.0
    z: "{config.wall_thickness}"
  - kind: edge_alignment
    subject: sbc
    subject_edge: rear
    target: enclosure
    target_edge: rear
  - kind: edge_alignment
    subject: sbc
    subject_edge: right
    target: enclosure
    target_edge: right

  # Hub: plain 180° Z-rotation, no flip (see header for why this reaches
  # "rear+left" the same way the old flip reached "rear+right"). Right-side
  # up, so it sits flat on the floor exactly like the SBC — raised the same
  # one wall-thickness, same reason.
  - kind: fixed_position
    subject: usb_breakout
    rotation: 180.0
    flip: false
    z: "{config.wall_thickness}"
  - kind: edge_alignment
    subject: usb_breakout
    subject_edge: rear
    target: enclosure
    target_edge: rear
  - kind: edge_alignment
    subject: usb_breakout
    subject_edge: left
    target: enclosure
    target_edge: left

  # ── Keyboard ──────────────────────────────────────────────────────────
  # Centered on X; on Y it clears the rear strip by 2 mm, which leaves the
  # palm rest as the remainder of the envelope.
  - kind: centered_on
    subject: keyboard
    axes: ["x"]
  - kind: edge_alignment
    subject: keyboard
    subject_edge: rear
    target: sbc
    target_edge: front
    offset: 2.0

  # ── Battery, in the hollow under the switch plate ─────────────────────
  # Left of the RP2040 controller, which occupies the middle of that space.
  - kind: relative_placement
    subject: battery
    target: keyboard
    offset_x: -50.0

  # ── Compactness: center the base content on Y ─────────────────────────
  # The enclosure is symmetric about the origin, so its depth is set by the
  # larger of the rear (SBC) and front (keyboard) extents. Centering the
  # whole base group makes those two extents equal, shrinking the depth to
  # the minimum the content allows instead of wasting a front palm rest.
  - kind: centered_group
    subjects: ["sbc", "keyboard", "battery", "usb_breakout"]
    axes: ["y"]

  # ── Base floor ────────────────────────────────────────────────────────
  # usb_breakout is flipped and gets its z set explicitly above, since this
  # resolver would otherwise overwrite it with a flip-unaware z=0. sbc is
  # likewise set explicitly above (raised onto its mounting bosses, off the
  # floor ribs), so it's left out of this layer too.
  - kind: z_stack
    layers: [["keyboard", "battery"]]

  # ── Lid ───────────────────────────────────────────────────────────────
  # The lid closes onto the base rim, so the display sits one keyboard-height
  # up, plus the lid's bottom wall and the driver board behind the panel:
  #   keyboard + clearance + wall + clearance + driver
  - kind: fixed_position
    subject: display
    z: "{keyboard.height} + 2 * {config.clearance.shell} + {config.wall_thickness} + {driver.height}"
  - kind: centered_on
    subject: display
    axes: ["x", "y"]

  # Driver board flat against the panel back (flipped), rotated 180° so its
  # FPC slot faces the panel ribbon. Offsets come from the component's own
  # reference_origin() (config/display.yaml driver_board), so the recipe
  # cannot drift away from the component definition. offset_z is -0.5 to
  # keep the PCB backside 0.5 mm off the panel (a flipped board hangs below
  # its origin).
  - kind: relative_placement
    subject: driver
    target: display
    use_reference_origin: true
    offset_z: -0.5
    rotation: 180.0
    flip: true

  # ── Checks ────────────────────────────────────────────────────────────
  # These produce no placements; they fail the build when the arrangement
  # above stops being physically buildable.

  # The hub's rear port strip is the deck's one externally-reachable I/O
  # surface in this layout — see header. The SBC's own Power/HDMI/USB-C are
  # all internal (routed by cable, not a wall cutout) and MicroSD no longer
  # needs one either, so none of the SBC's connectors get a port_access
  # check here.
  - kind: port_access
    subject: usb_breakout
    connector_type: USB-A
    wall: rear

  # The battery has to fit the hollow under the plate without fouling the
  # plate above it or the controller beside it.
  - kind: clearance
    subject: battery
    target: keyboard
    gap: 1.0

  # Rear strip parts must not run into each other — and, now that the SBC's
  # I/O edge faces the hub, must leave room for the USB-C-OTG-to-hub cable
  # to plug in and bend clear (measured requirement, not a guess).
  - kind: clearance
    subject: sbc
    target: usb_breakout
    gap: 30.0
    axis: x

  # Nothing in the base may touch the lid when it closes.
  - kind: clearance
    subject: keyboard
    target: driver
    gap: 2.0
    axis: z

  # HDMI from the SBC to the driver board, through the hinge wire tunnel.
  - kind: cable_path
    from_component: sbc
    from_connector_type: HDMI
    to_component: driver
    to_connector_type: HDMI
    via_point:
      - 0.0
      - "0 - ({sbc.depth} + 2.0 + {keyboard.depth} + 2 * {config.clearance.shell} + 2 * {config.wall_thickness}) / 2 - {config.wall_thickness}"
      - "{keyboard.height} + {config.clearance.shell}"
    clearance_diameter: "{config.hinge.wire_tunnel}"
    bend_radius: 30.0
