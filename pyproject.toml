[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberdeck"
version = "0.1.0"
description = "Parametric clamshell cyberdeck CAD generator for field debugging of 3D printers (CadQuery)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cyberdeck = "main:main"

[tool.setuptools]
packages = [
    "components",
    "geometry",
    "keyboard",
    "layouts",
    "assemblies",
    "case",
    "routing",
    "exports",
    "utilities",
]
py-modules = ["main"]

[tool.setuptools.package-data]
keyboard = ["reference/*.yaml", "layouts/*.json"]
