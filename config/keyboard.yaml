# Keyboard configuration: 40% Cherry-MX compatible, RP2040, QMK/Vial.
# All dimensions in millimeters.

keyboard:
  layout_source: keyboard/layouts/jd40.json
  switch:
    family: mx_alps
  stabilizer:
    family: cherry
  plate:
    thickness: 1.5
    edge_margin: 8.0
    corner_radius: 8.0
  mounting:
    screw: M2
    edge_offset: 5.0
  controller:
    rp2040: true
    width: 23.5
    depth: 18.0
    height: 8.0
    hole_diameter: 2.0

case_bottom_margin: 10
